<script>
function filterMenu(cat, btn) {
    // 1. Sabhi tabs se 'active' class remove karna
    const tabs = document.querySelectorAll('.tabs .tab');
    tabs.forEach(tab => tab.classList.remove('active'));

    // 2. Click kiye gaye tab par 'active' class add karna
    btn.classList.add('active');

    // 3. Category ke mutabiq menu items filter karna
    const cards = document.querySelectorAll('#menuGrid .card');
    cards.forEach(card => {
        if (card.dataset.cat === cat) {
            card.style.display = 'block';
        } else {
            card.style.display = 'none';
        }
    });
}
</script>
